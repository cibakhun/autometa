# Local database for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autometa
      POSTGRES_PASSWORD: autometa
      POSTGRES_DB: autometa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - autometa-db:/var/lib/postgresql/data
volumes:
  autometa-db:
