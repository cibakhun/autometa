# Same build setup as the other AgencyOS projects on Coolify: Node 22, a clean npm ci,
# Next.js build. `npm run start` migrates and fills the database before Next.js starts.

[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

# The deployed app imports real listings from these portals and follows their robots.txt.
# Values set in the app's environment variables in Coolify override these.
[variables]
SCRAPE_SOURCES = "autoscout24,kleinanzeigen,quoka,autohero,autode"
SCRAPE_RESPECT_ROBOTS = "true"
# Shortest pause between two requests to one portal. Only AutoScout24 paces itself down to it
# (its daily sweep of ~740,000 listings needs about 1 s); the other sources keep their own 3-5 s.
SCRAPE_MIN_DELAY_MS = "1000"
